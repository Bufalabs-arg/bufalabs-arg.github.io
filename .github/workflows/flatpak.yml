name: Paquete Flatpak de FRIDAY
# Cuando se publica una FRIDAY para Linux nueva (descargas/FRIDAY-linux.tar.gz), arma el paquete Flatpak
# con ese mismo programa y lo deja en descargas/FRIDAY.flatpak.
#
# Lo armamos a mano en el runner de siempre, sin el contenedor de Flathub: ahí /var/lib/flatpak vive
# en un overlayfs y ostree no puede enlazar los archivos que vienen de la imagen, así que actualizar
# los runtimes fallaba siempre con «Invalid cross-device link». Acá el disco es uno solo y anda.
on:
  push:
    branches: [main]
    paths:
      - 'descargas/FRIDAY-linux.tar.gz'
      - 'flatpak/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flatpak
  cancel-in-progress: true
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak --version && flatpak-builder --version
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Bajar el runtime y el SDK
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          flatpak list --runtime --columns=application,version,branch

      - name: Armar el paquete
        run: |
          # el repositorio que publicamos (el que se agrega en Discover) se va llenando versión a
          # versión, así que partimos del que ya está en la página en vez de empezar de cero
          if [ -d flatpak/repo/objects ]; then
            cp -a flatpak/repo repo
            # git no guarda carpetas vacías, y ostree las necesita todas para poder podar
            mkdir -p repo/refs/heads repo/refs/remotes repo/refs/mirrors repo/objects repo/tmp repo/state
          fi
          sudo flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean \
            --default-branch=master build flatpak/io.github.bufalabs_arg.FRIDAY.yml
          sudo flatpak build-bundle repo FRIDAY.flatpak io.github.bufalabs_arg.FRIDAY master
          sudo chown "$(id -u):$(id -g)" FRIDAY.flatpak

      - name: Dejar el repositorio al día (es el que se ve en Discover)
        run: |
          # que quede solo la última versión de cada cosa: si no, la página se llena de versiones
          # viejas que nadie va a instalar
          sudo flatpak build-update-repo --prune --prune-depth=1 repo
          sudo chown -R "$(id -u):$(id -g)" repo
          rm -rf flatpak/repo && mkdir -p flatpak && cp -a repo flatpak/repo
          rm -rf flatpak/repo/.lock flatpak/repo/tmp
          du -sh flatpak/repo
          test -f flatpak/repo/summary

      - name: Revisar el paquete
        run: |
          ls -la FRIDAY.flatpak
          test "$(stat -c %s FRIDAY.flatpak)" -gt 1000000

      - name: Dejarlo en descargas
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp FRIDAY.flatpak descargas/FRIDAY.flatpak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/FRIDAY.flatpak flatpak/repo
          git diff --cached --quiet && exit 0
          git commit -m "Paquete Flatpak de FRIDAY para Linux"
          git pull --rebase origin main
          git push origin HEAD:main
