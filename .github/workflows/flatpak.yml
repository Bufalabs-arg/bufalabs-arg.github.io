name: Paquete Flatpak de FRIDAY
# Cuando se publica una FRIDAY para Linux nueva (descargas/FRIDAY-linux.tar.gz), arma el paquete Flatpak
# con ese mismo programa y lo deja en descargas/FRIDAY.flatpak.
on:
  push:
    branches: [main]
    paths:
      - 'descargas/FRIDAY-linux.tar.gz'
      - 'flatpak/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flatpak
  cancel-in-progress: true
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      # Dentro del contenedor, /github/home viene montado de afuera. Si lo temporal cae en otro
      # sistema de archivos, ostree no puede mover lo que baja y los runtimes fallan al actualizarse
      # con «Invalid cross-device link». Lo dejamos al lado de la instalación de flatpak.
      TMPDIR: /github/home/tmp
    steps:
      - name: Preparar lo temporal (y ver dónde está cada cosa)
        run: |
          mkdir -p /github/home/tmp
          for d in /github/home /github/home/.local/share/flatpak /var/lib/flatpak /var/tmp /tmp; do
            [ -e "$d" ] && printf '%-44s dev=%s\n' "$d" "$(stat -c %d "$d")"
          done
          df -h | head -15
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: FRIDAY.flatpak
          manifest-path: flatpak/io.github.bufalabs_arg.FRIDAY.yml
          cache-key: friday-${{ hashFiles('descargas/FRIDAY-linux.tar.gz', 'flatpak/**') }}
          upload-artifact: false
      - name: Revisar el paquete
        run: |
          ls -la FRIDAY.flatpak
          test "$(stat -c %s FRIDAY.flatpak)" -gt 1000000
      - name: Dejarlo en descargas
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp FRIDAY.flatpak descargas/FRIDAY.flatpak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/FRIDAY.flatpak
          git diff --cached --quiet && exit 0
          git commit -m "Paquete Flatpak de FRIDAY para Linux"
          git pull --rebase origin main
          git push origin HEAD:main
